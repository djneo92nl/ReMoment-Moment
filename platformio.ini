; Shared by all boards
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags =
        -DDISABLE_ALL_LIBRARY_WARNINGS
        -DCORE_DEBUG_LEVEL=1
        -DGARNET_WEB_WIFI
        -DGARNET_WEB_OTA
        -DGARNET_WEB_SD
        -DGARNET_WEB_FILES
        -DGARNET_WEB_TIME
; Project headers (board/, ui/, net/, ...) only for our own sources: as a global flag, IDF
; components recompiled for custom_sdkconfig found src/settings.h instead of their own
build_src_flags = -I src

lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.4.2
  bitbank2/JPEGDEC@^1.8.2
  https://github.com/djneo92nl/garnet_web.git#v0.1.1

; Shared by both boards: pioarduino recompiles the one shared framework install for these, so
; differing settings per env would recompile it on every switch. Fixes the 7" RGB panel
; glitches: the bounce-buffer ISR must keep running during flash operations, and
; code/rodata run from PSRAM so flash access doesn't stall the cache (Espressif's RGB LCD
; guidance). First build recompiles the Arduino framework libs (pioarduino hybrid compile).
custom_sdkconfig =
        CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
        CONFIG_GDMA_ISR_IRAM_SAFE=y
        CONFIG_SPIRAM_XIP_FROM_PSRAM=y
        CONFIG_ESP32S3_DATA_CACHE_64KB=y
        CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
; Unused and not buildable in the hybrid compile (esp_insights embeds a certificate that
; pioarduino's embed step can't find)
custom_component_remove =
        espressif/esp_rainmaker
        espressif/rmaker_common
        espressif/esp_insights
        espressif/esp_diagnostics
        espressif/esp_diag_data_store

; Waveshare ESP32-S3-Touch-LCD-7B: 1024x600 RGB panel, GT911 touch, USB-UART bridge
[env:ESP32-S3-Touch-LCD-7B]
board = ESP32-S3-Touch-LCD-7B
upload_speed = 921600
build_flags =
        ${env.build_flags}
        -DUSB_MODE=1
        -DARDUINO_USB_CDC_ON_BOOT=0
        -DBOARD_WAVESHARE_7B
; JPEGDEC lists bb_spi_lcd for its examples only
lib_ignore = bb_spi_lcd, esp_lcd_st77922

; ES3C28P 3.5" module: 320x480 ST77922 QSPI panel, custom touch at 0x55, native USB
[env:ES3C28P]
board = ES3C28P
upload_speed = 460800
build_flags =
        ${env.build_flags}
        -DARDUINO_USB_MODE=1
        -DARDUINO_USB_CDC_ON_BOOT=1
        -DBOARD_ES3C28P
        -DLV_COLOR_16_SWAP=1
lib_ignore = bb_spi_lcd, rgb_lcd_port, lvgl_port, touch, io_extension, i2c, user_sd
